plugins {
    id 'com.android.application' version '8.3.0'
}

android {
    namespace 'com.nordtronics.companion'
    compileSdk 35

    defaultConfig {
        applicationId = "com.nordtronics.companion"
        minSdk = 24
        targetSdk = 35
        versionCode = 1
        versionName = "0.1"

        // ---------------------------------------------------------------------
        // THE API LOCATION. Every server address and every request path the app
        // uses is declared in this one block; ApiClient.java reads them as
        // BuildConfig fields and no other file names a host or a path.
        //
        // defaultConfig is the API contract for EVERY build type: the production
        // backend on nordtronics.io DNS over HTTPS. Task 0096 flipped the debug
        // build type onto this same contract — until then debug carried a dev
        // override pointing at the local mock backend on the emulator's loopback
        // alias, which is why the shipped debug APK showed mock data. The paths
        // below are the live API contract, confirmed against the running service
        // (tasks 0069, 0095, and re-confirmed 2026-10-02 for 0096):
        //     GET /healthz                        -> 200  {"status":"ok",...}
        //     GET /v1/nodes                       -> 200  {"nodes":[...]}
        //     GET /v1/nodes/{id}/readings         -> 200  {"readings":[...]}
        //     GET /v1/alerts                      -> 200  {"alerts":[...]}
        // The ping endpoint is only served by the local mock, so that one stays
        // null. A route this backend does not serve (GET /v1/network/status,
        // GET /v1/nodes/{id}) is answered 404, and HttpApiClient degrades for it
        // rather than failing the screen — see HttpApiClient's class comment.
        // ---------------------------------------------------------------------
        buildConfigField "String", "API_BASE_URL", "\"https://api.nordtronics.io\""
        buildConfigField "String", "PATH_NODES", "\"/v1/nodes\""
        buildConfigField "String", "PATH_HEALTH", "\"/healthz\""
        buildConfigField "String", "PATH_ALERTS", "\"/v1/alerts\""
        buildConfigField "String", "PATH_NODE_PING", "null"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            applicationIdSuffix = ""

            // -----------------------------------------------------------------
            // No dev override any more (task 0096). The debug build talks to the
            // same live API as release, because the debug APK is what Stephen
            // installs and it must show real readings, not mock ones. The bundled
            // MockApi is still compiled in as the OFFLINE fallback: when the
            // backend cannot be reached at all, ApiSource falls back to it and
            // Screens re-shows the "PROTOTYPE – MOCK DATA" banner, so mock data
            // is always labelled on screen and never mistaken for live data.
            //
            // app/src/debug/res/xml/network_security_config.xml still permits
            // cleartext to the emulator's loopback alias so that a developer can
            // run mock-server/server.py and a local HTTP backend by hand; the
            // app itself no longer names that address anywhere.
            // -----------------------------------------------------------------
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // appcompat pulls kotlin-stdlib-jdk8 (1.6.21) transitively while another
    // path brings kotlin-stdlib (1.8.22); the two disagree and the older jdk8
    // artifact re-declares classes that 1.8.x moved into kotlin-stdlib, so the
    // dex merge fails with "Duplicate class kotlin.streams.jdk8.StreamsKt".
    // The BOM aligns every kotlin-stdlib* module on one version, which is the
    // supported fix (the jdk8/jdk7 artifacts are empty shims from 1.8 onwards).
    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")
    implementation "androidx.appcompat:appcompat:1.7.0"
}
