plugins {
    id 'com.android.application' version '8.3.0'
}

android {
    namespace 'com.nordtronics.companion'
    compileSdk 35

    defaultConfig {
        applicationId = "com.nordtronics.companion"
        minSdk = 24
        targetSdk = 35
        versionCode = 1
        versionName = "0.1"

        // ---------------------------------------------------------------------
        // THE API LOCATION. Every server address and every request path the app
        // uses is declared in this one block; ApiClient.java reads them as
        // BuildConfig fields and no other file names a host or a path.
        //
        // defaultConfig is the RELEASE contract: the production backend on
        // nordtronics.io DNS over HTTPS. The paths below are the live API
        // contract, confirmed against the running service (task 0069):
        //     GET /v1/nodes   -> 200  {"nodes":[...]}
        //     GET /healthz    -> 200  {"status":"ok",...}
        // The service exposes no alerts feed and no ping endpoint (both 404),
        // so those two paths are declared null here rather than pointed at a
        // route that does not exist. The debug build type re-declares them
        // against the local mock, which serves a different dialect.
        // ---------------------------------------------------------------------
        buildConfigField "String", "API_BASE_URL", "\"https://api.nordtronics.io\""
        buildConfigField "String", "PATH_NODES", "\"/v1/nodes\""
        buildConfigField "String", "PATH_HEALTH", "\"/healthz\""
        buildConfigField "String", "PATH_ALERTS", "null"
        buildConfigField "String", "PATH_NODE_PING", "null"
    }

    buildFeatures {
        buildConfig true
    }

    // ---------------------------------------------------------------------
    // RELEASE SIGNING (task 0086).
    //
    // The production keystore lives OUTSIDE this repository
    // (~/.config/nordtronics/nordtronics-release.jks) and its password is
    // stored in exactly one place, also outside the repo
    // (~/.config/nordtronics/release-keystore.pw, 0600). Neither the
    // keystore, the password, nor any passphrase is ever committed.
    //
    // This block therefore reads PATHS from the environment, never secret
    // values:
    //     NORDTRONICS_KEYSTORE                 - path to the .jks
    //     NORDTRONICS_KEYSTORE_PASSWORD_FILE   - path to the 0600 password file
    //     NORDTRONICS_KEY_ALIAS                - optional; defaults to
    //                                            nordtronics-release
    // A gitignored `keystore.properties` in this directory may supply the
    // same two paths instead (keys `storeFile` / `storePasswordFile`); it
    // holds paths only.
    //
    // The config is applied ONLY when both paths resolve to files that
    // exist, so CI - which has neither - keeps building the unsigned
    // app-release-unsigned.apk exactly as before. A local build with the
    // paths set produces a production-signed app-release.apk.
    // ---------------------------------------------------------------------
    def ksp = rootProject.file('keystore.properties')
    def localProps = [:]
    if (ksp.exists()) {
        def p = new Properties()
        ksp.withInputStream { p.load(it) }
        localProps = p
    }
    def ksPath = localProps['storeFile'] ?: System.getenv('NORDTRONICS_KEYSTORE')
    def ksPwPath = localProps['storePasswordFile'] ?: System.getenv('NORDTRONICS_KEYSTORE_PASSWORD_FILE')
    def ksAlias = localProps['keyAlias'] ?: System.getenv('NORDTRONICS_KEY_ALIAS') ?: 'nordtronics-release'
    def signingReady = ksPath && ksPwPath && file(ksPath).exists() && file(ksPwPath).exists()

    signingConfigs {
        release {
            if (signingReady) {
                storeFile file(ksPath)
                // Read as a FILE, never a literal: the password stays in the
                // single 0600 file on disk and never appears in this build
                // script, in git, or in a Gradle log.
                storePassword file(ksPwPath).text.trim()
                keyAlias ksAlias
                keyPassword file(ksPwPath).text.trim()
                storeType 'pkcs12'
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix = ""

            // -----------------------------------------------------------------
            // THE DEV OVERRIDE, and the only place a literal address appears in
            // the app tree. This is the Android emulator's alias for the host
            // machine's loopback interface, where the local mock backend
            // listens (see mock-server/server.py, which refuses a non-loopback
            // bind). It is declared in the debug build type only, so it cannot
            // reach a release APK.
            //
            // The mock serves its own dialect: flat payloads under /api/... .
            // -----------------------------------------------------------------
            buildConfigField "String", "API_BASE_URL", "\"http://10.0.2.2:8000\""
            buildConfigField "String", "PATH_NODES", "\"/api/nodes\""
            buildConfigField "String", "PATH_ALERTS", "\"/api/alerts\""
            buildConfigField "String", "PATH_NODE_PING", "\"/api/nodes/%s/ping\""

            // The mock backend has no dedicated health route; its node list is
            // the only reachability probe it answers, so that is what the
            // health probe falls back to here (see ApiClient.healthPath()).
            buildConfigField "String", "PATH_HEALTH", "null"
        }
        release {
            minifyEnabled false
            // Applied only when the external keystore paths resolve (see the
            // RELEASE SIGNING block above); otherwise the release build stays
            // unsigned, exactly as CI produces it.
            if (signingReady) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    // appcompat pulls kotlin-stdlib-jdk8 (1.6.21) transitively while another
    // path brings kotlin-stdlib (1.8.22); the two disagree and the older jdk8
    // artifact re-declares classes that 1.8.x moved into kotlin-stdlib, so the
    // dex merge fails with "Duplicate class kotlin.streams.jdk8.StreamsKt".
    // The BOM aligns every kotlin-stdlib* module on one version, which is the
    // supported fix (the jdk8/jdk7 artifacts are empty shims from 1.8 onwards).
    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")
    implementation "androidx.appcompat:appcompat:1.7.0"
}
