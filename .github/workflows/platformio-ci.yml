name: PlatformIO CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test:
    name: Build and Test
    runs-on: esp32-s3-devkitc
    platform: Linux

    env:
      PLATFORMIO_CI_SRC: src
      PLATFORMIO_TEST_SRC: test

    steps:
      - name: 🛤️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Setup PlatformIO
        uses: platformio/actions@latest
        with:
          token: ${{ secrets.PLATFORMIO_TOKEN }}

      - name: 📦 Install dependencies
        run: pip install --upgrade platformio

      - name: 🔨 Build project
        run: platformio run -e esp32s3

      - name: 🧪 Run unit tests
        if: env.PLATFORMIO_TEST_SRC != ''
        run: platformio test -e esp32s3

      - name: 📊 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: platformio-build-${{ github.sha }}
          path: .pioenvs/esp32s3/

  # Optional: Deploy/Notify steps
  notify:
    name: Notify Result
    needs: build-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 📢 Send notification
        run: |
          echo "Build status: ${{ needs.build-test.result }}"
          # Add Slack/Discord/webhook notification here if desired
