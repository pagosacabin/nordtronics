name: PlatformIO Build

# Auto-build the Tank-Monitor firmware on every push
on:
  push:
    paths:
      - 'firmware/tank-monitor/**'
      - 'firmware/node-v1/**'
      - '.github/workflows/platformio.yml'
  pull_request:
    paths:
      - 'firmware/tank-monitor/**'
      - 'firmware/node-v1/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-platformio-${{ hashFiles('firmware/tank-monitor/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Check for PlatformIO project
        id: check
        run: |
          if [ -f firmware/tank-monitor/platformio.ini ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No platformio.ini in firmware/tank-monitor yet — skipping build."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build firmware
        if: steps.check.outputs.exists == 'true'
        run: pio run -d firmware/tank-monitor
