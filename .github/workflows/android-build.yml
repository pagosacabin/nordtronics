name: Android Build

on:
  push:
    branches: [android-toolchain-setup]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-hermes-test
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: android-toolchain-setup

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android-hermes-test/app/build/outputs/apk/debug/app-debug.apk