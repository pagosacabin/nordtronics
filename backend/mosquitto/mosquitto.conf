# Nordtronics wildfire MQTT broker — v1
# Deployed to /etc/mosquitto/nordtronics.conf on the VPS (see backend/DEPLOY.md).
#
# Validating this file:
#   mosquitto --test-config -c /etc/mosquitto/nordtronics.conf   # mosquitto >= 2.1
#   mosquitto -c /etc/mosquitto/nordtronics.conf                 # any 2.x, then Ctrl-C
# There is NO `-t` flag; `--test-config` is the documented validate-and-exit
# option and it only exists from 2.1 (Ubuntu 24.04 ships 2.0.18), so CI starts
# the broker and probes it instead — see backend/mosquitto/smoke-test.sh.

# ---------------------------------------------------------------- process ---
# The systemd unit already starts the process as the packaged `mosquitto` user.
# `user` is kept anyway: per mosquitto.conf(5) it "has no effect" when the
# broker is not root, so it costs nothing and covers a manual root start.
user mosquitto

# --------------------------------------------------------------- listener ---
# 8883/TLS is the only MQTT port UFW opens (docs/vps-hardening-runbook.md).
# There is deliberately no `listener 1883`: password auth over an unencrypted
# port would put base-station credentials on the wire.
listener 8883

# Let's Encrypt material for nordtronics.io, which covers mqtt.nordtronics.io.
# certbot renews these in place twice a day; the unit's renewal hook reloads
# the broker.
cafile   /etc/letsencrypt/live/nordtronics.io/chain.pem
certfile /etc/letsencrypt/live/nordtronics.io/fullchain.pem
keyfile  /etc/letsencrypt/live/nordtronics.io/privkey.pem

# TLS 1.2 floor; 1.3 is used whenever the client offers it.
tls_version tlsv1.2

# --------------------------------------------------------- authentication ---
# Exactly one listener, so the (deprecated) `per_listener_settings` option is
# not used: `allow_anonymous` and `password_file` apply globally.
# Users are created with mosquitto_passwd at deploy time — the file never
# lives in the repository.
allow_anonymous false
password_file /etc/mosquitto/passwd

# Least privilege on the topic tree. With an acl_file defined, mosquitto
# denies everything not listed here: the ingest worker may read every node's
# telemetry, and each base station may read/write only the topic tree named
# after its own username (= its node id).
acl_file /etc/mosquitto/acl

# ------------------------------------------------------------ persistence ---
persistence true
persistence_location /var/lib/mosquitto/

# ----------------------------------------------------------------- limits ---
# Telemetry documents are a few hundred bytes; 8 KB is a hard ceiling on what
# a compromised client can make the broker hold.
message_size_limit 8192
max_connections 64

# ---------------------------------------------------------------- logging ---
# stdout goes to journald: `journalctl -u mosquitto -f`.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%SZ
