; 0122 — LiDAR LDS-006 bring-up on NodeMCU-32S (bench, Stephen's wiring).
;
; Board setup chosen (and recorded for reproducibility):
;   - PlatformIO Core 6.1.18 with platform espressif32 @ 6.12.0, which ships
;     arduino-esp32 core 2.0.17 ("3.20017.241212" in PlatformIO's encoding).
;     2.x matters: the task's sketch uses ledcSetup()/ledcAttachPin()/ledcWrite(),
;     the 2.x LEDC API. Core 3.x removed those in favour of ledcAttach().
;   - board = nodemcu-32s (ESP-32S v1.1, classic ESP32, 4 MB flash, CP2102 USB-UART).
;   - USB port pinned by-id, never /dev/ttyUSB0 by name, so the port cannot be
;     confused with the ESP32-S3 node (ttyACM0) or the base (ttyACM2).
; Wiring is Stephen's and untouched by this project: LiDAR green -> 10k ->
; GPIO16 -> 23k -> GND (~2.8 V tap), LiDAR blue -> 1.6k -> GPIO17, LiDAR 5V/GND
; from the bench supply, common ground with the NodeMCU USB ground.

[env:nodemcu-32s]
platform = espressif32@6.12.0
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
upload_port = /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0
monitor_port = /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0
