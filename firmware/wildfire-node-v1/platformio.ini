; Wildfire Node v1 -- unified firmware (both roles in one binary).
;
; Task 0094. The base station is another Heltec LoRa 32 V4, so the two roles
; share one target; the role is decided at boot from a strap pin (GPIO7), an
; NVS/portal override, or the bench default (node). See src/role_detect.h.
;
;   pio run  -e heltec_v4      : build the firmware (CI: platformio.yml)
;   pio test -e native         : host-side consensus / protocol / role / portal tests
;
; The `native` env compiles the portable sources out of src/ together with the
; unity tests, so the engine under test is the engine the ESP32 runs.

[platformio]
default_envs = heltec_v4

[env:heltec_v4]
; The release target is the Heltec HTIT-WB32LAF V4.2 (ESP32-S3R2). PlatformIO's
; espressif32 platform ships the V3 board definition for the same Silicon/Arduino
; core; the V4.2 differences that matter here (SX1262 US915, ESP32-S3) are the
; same, and the pin map is stated explicitly in src/firmware_config.h rather than
; taken from the board JSON.
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
board_build.mcu = esp32s3
board_build.partitions = default_16MB.csv
; The image is laid out for the 16 MB table above, but PlatformIO's board JSON
; for heltec_wifi_lora_32_V3 declares 8 MB. Without these two keys the uploader
; and the linker disagree with the partition layout and the board boots into a
; reset loop (task 0099 item 1). flash_size must match the physical part, and
; maximum_size is the app-region bound the linker checks against.
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; build_flags note: ESP32-S3 needs -DARDUINO_USB_CDC_ON_BOOT=1, or Serial goes to
; UART0 (GPIO43/44) and the native USB port reads as silence -- an unconfigurable
; board with a "dead" console (task 0099 item 2). PlatformIO's ini parser treats
; a `;` line inside a multi-line value as part of the value, so the explanation
; lives here rather than inside the list.
build_flags =
    -DWILDFIRE_UNIFIED_V1=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I src
build_unflags = -std=gnu++11
lib_deps =
    jgromes/RadioLib@^7.0.0
    knolleary/PubSubClient@^2.8
    olikraus/U8g2@^2.35.30
    adafruit/Adafruit BME680 Library@^2.0.4
    adafruit/Adafruit Unified Sensor@^1.1.14

[env:native]
platform = native
test_build_src = true
build_src_filter =
    -<*>
    +<consensus_v02.cpp>
    +<radio_protocol.cpp>
    +<role_detect.cpp>
build_flags = -std=gnu++17 -I src -Wall -Wextra

; NOTE: do not add a `test_filter` here. With multiple space-separated names
; PlatformIO collects the test directories and then silently runs ZERO cases
; ("0 test cases: 0 succeeded"), which looks like a green no-op. All three test
; directories are meant to run on every invocation, so there is no filter.
