# C4002 presence sensor — ESP32-C3 Super Mini (bench task 0169, 2026-11-06)
#
# Deliberately small surface. This part is a presence detector with a single-target range
# estimate bolted on: with one body in the beam the range/speed/energy numbers mean something,
# with two or more they collapse to "one of them" and the number is not attributable. So the
# device exposes presence (the reliable thing) plus a range labelled for what it is, and a
# single status number. The earlier speed/energy/gate-mask/OUT-pin entities were removed: they
# implied a tracker this sensor is not. Measurements behind that are in the nordtronics repo,
# firmware/c4002-presence/README.md.
#
# Requires secrets.yaml with wifi_ssid / wifi_password.
esphome:
  name: c4002-presence
  friendly_name: C4002 Presence

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
ota:
  - platform: esphome
logger:

external_components:
  - source:
      type: git
      url: https://github.com/OwlBawl/DFRobot_C4002_SEN0691.git
      ref: main
      path: .
    components: [dfrobot_c4002]
    refresh: 0s

uart:
  id: c4002_uart
  tx_pin: GPIO7
  rx_pin: GPIO6
  baud_rate: 115200
  parity: NONE
  stop_bits: 1

dfrobot_c4002:
  id: my_c4002
  uart_id: c4002_uart

binary_sensor:
  # The one thing this part is actually good at. delayed_off holds presence 30 s after the
  # target goes, which is what makes it usable for "is the room occupied" automations.
  - platform: dfrobot_c4002
    c4002_id: my_c4002
    presence:
      name: "Presence"
      device_class: presence
      filters:
        - delayed_off: 30s

sensor:
  # Single-target range. Honest name: with more than one body in the 120 deg beam this is the
  # range of whichever target the firmware latched, not "the" target.
  - platform: dfrobot_c4002
    c4002_id: my_c4002
    existing_distance:
      name: "Range"
      unit_of_measurement: "m"
      accuracy_decimals: 2
      icon: mdi:radar
  # 0 = no body, 1 = stationary body, 2 = moving body: one number instead of three channels.
  - platform: dfrobot_c4002
    c4002_id: my_c4002
    target_status:
      name: "Detected"
      accuracy_decimals: 0
      entity_category: diagnostic
      icon: mdi:motion-sensor

# ---- knobs: every one is entity_category config, so they stay out of the way --------------
number:
  - platform: dfrobot_c4002
    c4002_id: my_c4002
    target_disappeard_delay_time:
      name: "Disappear delay"

switch:
  - platform: dfrobot_c4002
    c4002_id: my_c4002
    switch_run_led:
      name: "Run LED"

select:
  - platform: dfrobot_c4002
    c4002_id: my_c4002
    operating_mode:
      name: "OUT mode"
