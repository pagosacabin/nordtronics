plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nordtronics.hermestest'
    compileSdk 35

    defaultConfig {
        applicationId = "com.nordtronics.hermestest"
        minSdk = 24
        targetSdk = 35
        versionCode = 1
        versionName = "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
}