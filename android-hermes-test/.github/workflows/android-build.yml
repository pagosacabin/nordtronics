name: Android Build

on:
  push:
    branches: [android-toolchain-setup]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch (full)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug - verify AndroidManifest exists at correct path
        run: |
          echo "=== Repo root ==="
          pwd
          ls -la
          echo "=== android-hermes-test/app/src/main ==="
          ls -la android-hermes-test/app/src/main/
          echo "=== AndroidManifest.xml content ==="
          cat android-hermes-test/app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: '34.0.0'
          ndk-version: r26d

      - name: Assemble Debug APK
        working-directory: android-hermes-test
        run: ./gradlew --no-configuration-cache assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android-hermes-test/app/build/outputs/apk/debug/app-debug.apk